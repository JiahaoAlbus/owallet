name: Add YNX Testnet chain config

on:
  push:
    branches:
      - add-ynx-testnet-6423

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-ynx-testnet-6423
      - name: Add YNX Testnet to OWallet config
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/common/src/config.ts')
          s = p.read_text()
          if 'chainId: "eip155:6423"' not in s:
              lines = [
                  '  {',
                  '    rpc: "https://evm.ynxweb4.com",',
                  '    rest: "https://evm.ynxweb4.com",',
                  '    evm: {',
                  '      chainId: 6423,',
                  '      rpc: "https://evm.ynxweb4.com",',
                  '    },',
                  '    chainId: "eip155:6423",',
                  '    chainName: "YNX Testnet",',
                  '    networkType: "evm",',
                  '    beta: true,',
                  '    chainSymbolImageUrl:',
                  '      "https://ipfs.io/ipfs/bafkreibydfqibqwvm5dpwnyjjk7gruoyt2v5rivstk2pc65ojcwh4px73y",',
                  '    bip44: {',
                  '      coinType: 60,',
                  '    },',
                  '    currencies: [',
                  '      {',
                  '        coinDenom: "YNXT",',
                  '        coinMinimalDenom: "ynxt-native",',
                  '        coinDecimals: 18,',
                  '        coinImageUrl:',
                  '          "https://ipfs.io/ipfs/bafkreibydfqibqwvm5dpwnyjjk7gruoyt2v5rivstk2pc65ojcwh4px73y",',
                  '      },',
                  '    ],',
                  '    feeCurrencies: [',
                  '      {',
                  '        coinDenom: "YNXT",',
                  '        coinMinimalDenom: "ynxt-native",',
                  '        coinDecimals: 18,',
                  '        coinImageUrl:',
                  '          "https://ipfs.io/ipfs/bafkreibydfqibqwvm5dpwnyjjk7gruoyt2v5rivstk2pc65ojcwh4px73y",',
                  '      },',
                  '    ],',
                  '    features: ["not-support-staking"],',
                  '    txExplorer: {',
                  '      name: "YNX Explorer",',
                  '      txUrl: "https://explorer.ynxweb4.com/tx/{txHash}",',
                  '      accountUrl: "https://explorer.ynxweb4.com/address/{address}",',
                  '    },',
                  '  },',
              ]
              entry = '\n'.join(lines) + '\n'
              anchor = 'export const EmbedChainInfos: ChainInfo[] = [\n'
              if anchor not in s:
                  raise SystemExit('EmbedChainInfos anchor not found')
              s = s.replace(anchor, anchor + entry, 1)
              p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/ynx-patch.yml
          git config user.name "JiahaoAlbus"
          git config user.email "159010359+JiahaoAlbus@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add YNX Testnet chain config"
          git push origin HEAD:add-ynx-testnet-6423
